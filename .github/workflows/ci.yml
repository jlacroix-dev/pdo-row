name: CI

on: [push]

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo, pdo_mysql, pdo_sqlite
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run CI
        run: composer ci

  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build PHP image
        run: docker compose run --rm php composer install --no-interaction --prefer-dist

      - name: Run tests
        run: docker compose run --rm php composer test
